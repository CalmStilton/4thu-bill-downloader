services:
  4thu-bill-downloader:
    image: ghcr.io/calmstilton/4thu-bill-downloader:latest
    container_name: 4thu-bill-downloader
    restart: "no"          # ephemeral: Ofelia's job-run starts it on schedule and it exits
    environment:
      ISP_USERNAME: ${ISP_USERNAME}
      ISP_PASSWORD: ${ISP_PASSWORD}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-gdrive}
      RCLONE_PATH: ${RCLONE_PATH:-}
      # Overrides root_folder_id for the "gdrive" remote in rclone.conf, so the
      # Drive destination folder ID lives here as a named stack env var instead
      # of being buried in a host file. This is Google Drive-specific (the
      # underlying rclone override syntax is RCLONE_CONFIG_<REMOTE>_<KEY>,
      # remote name uppercased) - if RCLONE_REMOTE above is ever changed away
      # from "gdrive", this line's key must be updated to match, e.g.
      # RCLONE_CONFIG_MYREMOTE_ROOT_FOLDER_ID. Any other rclone destination
      # (SFTP, S3, a NAS, etc.) is configured directly in rclone.conf on the
      # host instead - see README's "Adding another rclone destination".
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${RCLONE_GDRIVE_ROOT_FOLDER_ID:-}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_NOTIFY_SERVICE: ${HA_NOTIFY_SERVICE:-persistent_notification/create}
      HA_NOTIFY_ON_SUCCESS: ${HA_NOTIFY_ON_SUCCESS:-true}
      HA_NOTIFY_ON_ERROR: ${HA_NOTIFY_ON_ERROR:-true}
      # BookStack run-history page - see README's "Wiki run history" section
      # for the one-time service-account setup these credentials belong to.
      BOOKSTACK_URL: ${BOOKSTACK_URL:-}
      BOOKSTACK_TOKEN_ID: ${BOOKSTACK_TOKEN_ID:-}
      BOOKSTACK_TOKEN_SECRET: ${BOOKSTACK_TOKEN_SECRET:-}
      BOOKSTACK_PAGE_ID: ${BOOKSTACK_PAGE_ID:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
