services:
  4thu-bill-downloader:
    build: .
    image: 4thu-bill-downloader:latest
    container_name: 4thu-bill-downloader
    restart: "no"          # ephemeral: Ofelia's job-run starts it on schedule and it exits
    environment:
      ISP_USERNAME: ${ISP_USERNAME}
      ISP_PASSWORD: ${ISP_PASSWORD}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-gdrive}
      RCLONE_PATH: ${RCLONE_PATH:-}
      # Overrides root_folder_id for the "gdrive" remote in rclone.conf, so the
      # destination folder ID lives here as a stack env var instead of being
      # buried in a host file. rclone's env override naming is
      # RCLONE_CONFIG_<REMOTE>_<KEY> (remote name uppercased) - if RCLONE_REMOTE
      # above is ever changed away from "gdrive", this variable name must be
      # updated to match, e.g. RCLONE_CONFIG_MYREMOTE_ROOT_FOLDER_ID.
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${RCLONE_ROOT_FOLDER_ID:-}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      HA_NOTIFY_SERVICE: ${HA_NOTIFY_SERVICE:-persistent_notification/create}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
